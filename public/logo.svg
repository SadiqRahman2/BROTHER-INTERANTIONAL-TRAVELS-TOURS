<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#580D18" />
      <stop offset="50%" stop-color="#460710" />
      <stop offset="100%" stop-color="#34040B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C07B" />
      <stop offset="50%" stop-color="#FFD200" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Deep Burgundy Background -->
  <rect width="540" height="200" rx="16" fill="url(#burgundyGrad)" />
  <rect x="3" y="3" width="534" height="194" rx="13" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Stylized White "B" Emblem -->
  <g transform="translate(24, 28)" filter="url(#subtleGlow)">
    <!-- Outer shield / emblem backplate -->
    <rect width="144" height="144" rx="20" fill="#3D050D" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.5" />
    
    <!-- Stylized "B" Monogram: Dynamic swooshes evoking flight wings and travel -->
    <!-- Stem & Top Loop -->
    <path d="M 38 28 L 38 116" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" />
    <path d="M 38 34 H 82 C 104 34 116 45 116 59 C 116 71 106 80 88 82 C 110 84 122 95 122 109 C 122 124 106 134 82 134 H 38" 
          fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Golden Aerodynamic Travel Swoosh through middle divider -->
    <path d="M 38 82 L 86 82" stroke="#FFC709" stroke-width="7" stroke-linecap="round" />
    
    <!-- Fine luxury dot accents -->
    <circle cx="82" cy="58" r="4.5" fill="#FFC709" />
    <circle cx="86" cy="108" r="4.5" fill="#FFC709" />
    <path d="M 124 40 L 130 34" stroke="#FFC709" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <!-- BROTHERS in Bright Yellow -->
  <g transform="translate(192, 40)">
    <text x="0" y="44" 
          font-family="'Plus Jakarta Sans', 'Montserrat', -apple-system, sans-serif" 
          font-weight="900" 
          font-size="46" 
          letter-spacing="5" 
          fill="#FFC709" 
          filter="url(#subtleGlow)">
      BROTHERS
    </text>

    <!-- INTERNATIONAL TRAVEL & TOURS in White -->
    <text x="2" y="80" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-weight="700" 
          font-size="15.5" 
          letter-spacing="3.8" 
          fill="#FFFFFF">
      INTERNATIONAL TRAVEL &amp; TOURS
    </text>

    <!-- Horizontal subtle divider -->
    <line x1="2" y1="94" x2="310" y2="94" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- SINCE 2024 Tagline with Gold Accents -->
    <g transform="translate(0, 118)">
      <circle cx="5" cy="-4" r="2.5" fill="#FFC709" />
      <text x="18" y="0" 
            font-family="'Plus Jakarta Sans', 'Montserrat', -apple-system, sans-serif" 
            font-weight="600" 
            font-size="12" 
            letter-spacing="5" 
            fill="#E5C07B">
        SINCE 2024
      </text>
      <line x1="125" y1="-4" x2="310" y2="-4" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3" />
    </g>
  </g>
</svg>
